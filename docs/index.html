<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Syntax Highlighter in Elixir</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1c1e21;
            --muted: #5c6370;
            --border: #d9dce1;
            --link: #0b5fd0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14161a;
                --fg: #e6e8eb;
                --muted: #9aa1ac;
                --border: #2c3038;
                --link: #7ab0ff;
            }
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main {
            max-width: 42rem;
            margin: 0 auto;
            padding: 3rem 1rem;
        }
        h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 1rem; }
        h2 { font-size: 1.1rem; margin: 2rem 0 0.5rem; }
        p { margin: 0 0 1rem; }
        a { color: var(--link); }
        ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--border); }
        li { border-bottom: 1px solid var(--border); padding: 0.75rem 0; }
        li span { display: block; color: var(--muted); font-size: 0.9rem; }
        footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.9rem; }
    </style>
</head>
<body>
<main>
    <h1>Python Syntax Highlighter in Elixir</h1>
    <p>An Elixir program that reads a Python file, highlights its syntax, and writes an HTML page.</p>

    <h2>Samples</h2>
    <ul>
        <li>
            <a href="samples/example1_OOP.html">example1_OOP.py</a>
            <span>Object-oriented sample</span>
        </li>
        <li>
            <a href="samples/example2_Procedural.html">example2_Procedural.py</a>
            <span>Procedural sample</span>
        </li>
        <li>
            <a href="samples/example3_Functional.html">example3_Functional.py</a>
            <span>Functional sample</span>
        </li>
    </ul>

    <footer>
        <a href="https://github.com/pridapablo/ITESM-syntaxHighlighter-TC2037">Source on GitHub</a>
    </footer>
</main>
</body>
</html>
